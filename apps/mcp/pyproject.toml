[project]
name = "kyb-vetter-mcp"
version = "0.1.0"
description = "MCP server (stdio locally, Streamable HTTP in the cloud) - thin adapter over core"
requires-python = ">=3.15"
dependencies = [
    "kyb-vetter-core",
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pydantic>=2.14",
    "uvicorn>=0.54",
    "starlette>=0.50",
    "opentelemetry-instrumentation-starlette>=0.66b1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
