# Keeps the digest-pinned base images (Dockerfile), the actions in
# .github/workflows and the Python lockfile (uv.lock, workspace root) current.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(docker)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR per week for routine bumps; majors still arrive one by one.
      python-minor-patch:
        update-types:
          - minor
          - patch
