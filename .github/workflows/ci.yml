name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# No `id-token` here: `check` runs every dependency and must not be able to mint an OIDC token.
# Only the deploy jobs below get it (ADR-0025).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run ty check

      - name: Module boundaries
        run: uv run tach check && uv run tach check-external

      - name: Test
        run: uv run pytest

  deploy-dev:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, dev project: `dev` environment on main only
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit

  deploy-prod:
    # Promotion is explicit: push a tag `vX.Y.Z`; the tag is built and tested by `check` first.
    # The prod project accepts tokens only from the `prod` environment on a `v*` tag (ADR-0025),
    # so these conditions are enforced in the cloud too, not just in this file.
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, prod project
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
