[project]
name = "kyb-vetter-core"
version = "0.1.0"
description = "Domain core: register clients, NIP/REGON/NRB validation, models, rate limits, audit"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "py7zr>=1.1",
    "ijson>=3.6",
    "google-cloud-storage>=3.17",
    "pyjwt[crypto]>=2.15",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45",
    "google-auth>=2.40",
    "grpcio>=1.70",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
