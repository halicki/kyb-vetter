# Workspace root. It is a *virtual* project (no [build-system]): it is never
# built or installed, it only pins the shared toolchain and dev dependencies.
# The product name lives in ONE place per layer (see docs/adr/0004):
#   - this file: [project].name
#   - code:      kyb_vetter_core.config.Settings.project_name
#   - infra:     Terraform variable project_name
[project]
name = "kyb-vetter"
version = "0.0.0"
description = "KYB / counterparty verification for AI agents - Polish public registers (workspace root)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.91",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "respx>=0.23",
    "httpx>=0.28",
    "pre-commit>=4.7",
    "tach>=0.35.3",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
kyb-vetter-core = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["packages/*/src", "apps/*/src"]
# target-version is inferred from requires-python.

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "S",         # flake8-bandit
    "ASYNC",     # flake8-async
    "T20",       # flake8-print: no print() - stdout is the MCP stdio channel
    "PT",        # flake8-pytest-style
    "SIM",       # flake8-simplify
    "C4",        # flake8-comprehensions
    "TID",       # flake8-tidy-imports
    "TC",        # flake8-type-checking
    "RUF",       # ruff-specific
]
ignore = [
    "E501",      # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "TC"]   # asserts, test secrets and plain typing imports are fine in tests
"evals/**" = ["S101", "ASYNC240"]  # scenario runner is a test; file reads are tiny JSON

[tool.ruff.lint.flake8-type-checking]
# pydantic reads field annotations at runtime, so their imports must not be deferred
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "kyb_vetter_core.storage.postgres.Base",
]

[tool.ruff.lint.isort]
known-first-party = ["kyb_vetter_core", "kyb_vetter_mcp", "kyb_vetter_api", "kyb_vetter_worker"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
# Warnings fail the run (terminal.error-on-warning defaults to true).
# ty has no "strict" profile; the override below is the strict profile for core.
[tool.ty.src]
include = ["packages", "apps"]
exclude = ["**/.venv", "**/__pycache__"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.15"

[tool.ty.rules]
possibly-unresolved-reference = "error"

[[tool.ty.overrides]]
include = ["packages/core/src/**"]

[tool.ty.overrides.rules]
all = "error"

[tool.ty.overrides.analysis]
return-type-inference = "always"
strict-equality-semantics = true
strict-generic-narrowing = true

[[tool.ty.overrides]]
# SQLAlchemy declarative mapping infers column types from the `Mapped[...]` annotation;
# `mapped_column()` without an explicit type is `MappedColumn[Any]` by design.
include = ["packages/core/src/kyb_vetter_core/storage/postgres.py"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "apps", "evals"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not live' --cov --cov-report=term-missing"
markers = [
    "live: hits real external (government) APIs; disabled by default, run with `-m live`",
    "eval: deterministic tool-behaviour scenarios from evals/scenarios (run by default)",
    "db: needs Postgres via APP_TEST_DATABASE_URL (compose locally, service container in CI); skipped otherwise",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------- coverage
# 100% is a hard gate: core is pure logic built test-first. Bootstrap-only code
# in apps may carry `# pragma: no cover` with a reason.
[tool.coverage.run]
source = ["packages/core/src", "apps/mcp/src", "apps/api/src", "apps/worker/src"]
branch = true
omit = [
    "*/__main__.py",            # process entry points, exercised by hand (MCP Inspector)
    "*/clients/protocols.py",  # typing-only Protocols, imported under TYPE_CHECKING
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

# ---------------------------------------------------------------- tach
# Module boundaries (ADR-0008). Two checks, two scopes:
#   tach check-external  cross-package direction (apps -> core, never the reverse,
#                        apps never import each other). Derived from each member's
#                        [project].dependencies - no second source of truth here.
#   tach check           boundaries *inside* a package. Each member has its own
#                        pyproject.toml, so tach treats it as a separate
#                        distribution and `tach check` never sees cross-package
#                        imports; `depends_on` below is intentionally empty.
[tool.tach]
source_roots = ["packages/core/src", "apps/mcp/src", "apps/api/src", "apps/worker/src"]
exclude = ["**/tests", "**/__pycache__", ".venv"]
exact = true                        # every declared `depends_on` must be used
forbid_circular_dependencies = true
ignore_type_checking_imports = true # `if TYPE_CHECKING:` imports are not runtime coupling

[tool.tach.external]
# asyncpg is loaded by SQLAlchemy from the URL scheme; alembic runs from packages/core/alembic (outside src)
exclude = ["asyncpg", "alembic"]

[tool.tach.rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"

[[tool.tach.modules]]
path = "kyb_vetter_core"
depends_on = []

# Core internals: errors and config at the bottom, clients at the top.
[[tool.tach.modules]]
path = "kyb_vetter_core.errors"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_core.config"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_core.identifiers"
depends_on = ["kyb_vetter_core.errors"]

[[tool.tach.modules]]
path = "kyb_vetter_core.storage"
depends_on = [
    "kyb_vetter_core.storage.memory",
    "kyb_vetter_core.storage.ports",
    "kyb_vetter_core.storage.postgres",
]

[[tool.tach.modules]]
path = "kyb_vetter_core.storage.ports"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_core.storage.memory"
depends_on = []  # ports imported under TYPE_CHECKING only

[[tool.tach.modules]]
path = "kyb_vetter_core.storage.postgres"
depends_on = ["kyb_vetter_core.storage.ports"]

[[tool.tach.modules]]
path = "kyb_vetter_core.quota"
depends_on = ["kyb_vetter_core.clients.whitelist", "kyb_vetter_core.errors", "kyb_vetter_core.identifiers"]

[[tool.tach.modules]]
path = "kyb_vetter_core.cache"
depends_on = [
    "kyb_vetter_core.clients.whitelist",
    "kyb_vetter_core.identifiers",
    "kyb_vetter_core.models",
    "kyb_vetter_core.storage.ports",
]

[[tool.tach.modules]]
path = "kyb_vetter_core.audit"
depends_on = ["kyb_vetter_core.errors", "kyb_vetter_core.storage.ports"]

[[tool.tach.modules]]
path = "kyb_vetter_core.assembly"
depends_on = [
    "kyb_vetter_core.audit",
    "kyb_vetter_core.cache",
    "kyb_vetter_core.clients.krs",
    "kyb_vetter_core.clients.whitelist",
    "kyb_vetter_core.quota",
    "kyb_vetter_core.verification",
]

[[tool.tach.modules]]
path = "kyb_vetter_core.sanitize"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_core.verification"
# clients are injected and imported only under TYPE_CHECKING (ignore_type_checking_imports)
depends_on = [
    "kyb_vetter_core.config",
    "kyb_vetter_core.errors",
    "kyb_vetter_core.identifiers",
    "kyb_vetter_core.models",
    "kyb_vetter_core.sanitize",
]

[[tool.tach.modules]]
path = "kyb_vetter_core.models"
depends_on = ["kyb_vetter_core.errors"]

[[tool.tach.modules]]
path = "kyb_vetter_core.clients.whitelist"
depends_on = ["kyb_vetter_core.errors", "kyb_vetter_core.identifiers", "kyb_vetter_core.models"]

[[tool.tach.modules]]
path = "kyb_vetter_core.clients.krs"
depends_on = ["kyb_vetter_core.errors", "kyb_vetter_core.identifiers", "kyb_vetter_core.models"]

[[tool.tach.modules]]
path = "kyb_vetter_mcp"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_api"
depends_on = []

[[tool.tach.modules]]
path = "kyb_vetter_worker"
depends_on = []
